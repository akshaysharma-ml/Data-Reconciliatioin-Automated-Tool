[tool.poetry]
name = "financial-data-reconciliation"
version = "1.0.0"
description = "Comprehensive financial data reconciliation system"
authors = ["Your Name <your.email@example.com>"]
license = "MIT"
readme = "README.md"
packages = [{ include = "*", from = "src" }]

[tool.poetry.dependencies]
python = "^3.10"
fastapi = "0.115.6"
uvicorn = { version = "0.34.0", extras = ["standard"] }
sqlalchemy = "2.0.36"
pydantic = "2.10.4"
python-multipart = "0.0.20"
PyYAML = "6.0.2"
psycopg2-binary = "2.9.10"
pandas = "2.2.3"
numpy = "2.1.3"
openpyxl = "3.1.5"
python-dateutil = "2.9.0.post0"
email-validator = "2.2.0"
cryptography = "44.0.0"
streamlit = "1.41.1"

[tool.poetry.group.dev.dependencies]
pytest = "8.3.4"
pytest-asyncio = "0.25.0"
httpx = "0.28.1"
black = "^24.10"
isort = "^5.13"
mypy = "^1.13"
flake8 = "^7.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.black]
line-length = 100

[tool.isort]
profile = "black"
line_length = 100
